<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;

            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .heading p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;

            padding: 12px 15px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #667eea;

            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            width: 50%;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .joining-date {
            background: #f5f5f5;
            color: #777;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .required {
            color: red;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .form-row .form-group {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>Employee Updation Form --> {{ id }}</h1>
            <p>Enter employee details below</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div
                    class="alert {{message.tags}} my-3"
                    role="alert"
                >
                    <strong>{{message}}</strong>
                </div>
                            
            {% endfor %}        
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- Employee Name -->
            <div class="form-group">
                <label>
                    Employee Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="emp_name"
                    maxlength="150"
                    placeholder="Enter employee name"
                    value="{{emp.emp_name}}"
                    required
                >
            </div>


            <!-- Email & Mobile -->
            <div class="form-row">

                <div class="form-group">
                    <label>
                        Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        name="emp_email"
                        maxlength="250"
                        placeholder="example@gmail.com"
                        value="{{emp.emp_email}}"
                        readonly required
                    >
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>

                    <input
                        type="text"
                        name="emp_mobile"
                        maxlength="10"
                        placeholder="Enter mobile number"
                        value="{{emp.emp_mobile}}"
                    >
                </div>

            </div>


            <!-- Department & DOB -->
            <div class="form-row">

                <div class="form-group">
                    <label>Department</label>

                    <select name="emp_dept">

                        <option value="it" {% if emp.emp_dept == "it" %}selected{% endif %}>
                            Information Technology
                        </option>

                        <option value="sales" {% if emp.emp_dept == "sales" %}selected{% endif %}>
                            Sales Representative
                        </option>

                        <option value="admin" {% if emp.emp_dept == "admin" %}selected{% endif %}>
                            Administrator
                        </option>

                        <option value="marketing" {% if emp.emp_dept == "marketing" %}selected{% endif %}>
                            Digital Marketing
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="emp_dob"
                        value="{{ emp.emp_dob|date:'Y-m-d' }}"
                    >
                </div>

            </div>


            <!-- Address -->
            <div class="form-group">

                <label>Address</label>

                <textarea
                    name="emp_address"
                    placeholder="Enter employee address"
                >{{emp.emp_address}}</textarea>

            </div>


            <!-- Joining Date -->
            <div class="form-group">

                <label>Joining Date</label>

                <input
                    type="text"
                    class="joining-date"
                    value="Automatically added by Django"
                    readonly
                >

            </div>


            <!-- Submit -->
            <button type="submit" class="btn">
                Update Employee
            </button>

        </form>

    </div>

</body>
</html>
