<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            background:
                linear-gradient(
                    135deg,
                    #4facfe,
                    #7367f0,
                    #9b59b6
                );
        }


        /* Main Card */

        .container {

            width: 100%;
            max-width: 750px;

            background: rgba(255, 255, 255, 0.96);

            padding: 40px;

            border-radius: 22px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);
        }


        /* Header */

        .header {

            text-align: center;

            margin-bottom: 35px;
        }


        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #4facfe,
                    #7367f0
                );

            color: white;

            font-size: 32px;
        }


        .header h1 {

            font-size: 30px;

            color: #222;

            margin-bottom: 8px;
        }


        .header p {

            color: #777;

            font-size: 14px;
        }


        /* Form */

        .form-group {

            margin-bottom: 22px;
        }


        .form-row {

            display: flex;

            gap: 20px;
        }


        .form-row .form-group {

            flex: 1;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #333;
        }


        .required {

            color: #e74c3c;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            background: #fafafa;

            font-size: 14px;

            color: #333;

            outline: none;

            transition: all 0.3s ease;
        }


        input:hover,
        select:hover,
        textarea:hover {

            border-color: #7367f0;
        }


        input:focus,
        select:focus,
        textarea:focus {

            background: white;

            border-color: #7367f0;

            box-shadow:
                0 0 0 3px
                rgba(115, 103, 240, 0.12);
        }


        textarea {

            min-height: 110px;

            resize: vertical;
        }


        /* Joining Date */

        .joining-date {

            background: #eeeeee;

            color: #777;

            cursor: not-allowed;
        }


        /* Submit Button */

        .btn {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #4facfe,
                    #7367f0
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        .btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(115, 103, 240, 0.35);
        }


        .btn:active {

            transform: translateY(0);
        }


        /* Footer */

        .footer {

            text-align: center;

            margin-top: 20px;

            color: #888;

            font-size: 12px;
        }


        /* Mobile */

        @media (max-width: 650px) {

            body {

                padding: 20px 10px;
            }


            .container {

                padding: 25px 20px;
            }


            .form-row {

                flex-direction: column;

                gap: 0;
            }


            .header h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- Header -->

        <div class="header">

            <div class="icon">
                🎓
            </div>

            <h1>
                Student Updation Form --> {{ id }}
            </h1>

            <p>
                Enter the student's information below
            </p>

        </div>


        <!-- Form -->

        {% if messages %}
            {% for message in messages %}
                <div
                    class="alert {{message.tags}} my-3"
                    role="alert"
                >
                    <strong>{{message}}</strong>
                </div>
                            
            {% endfor %}        
        {% endif %}

        <form method="POST">

            {% csrf_token %}


            <!-- Student Name -->

            <div class="form-group">

                <label>
                    Student Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="std_name"
                    maxlength="150"
                    placeholder="Enter student's full name"
                    value="{{ std.std_name }}"
                    required
                >

            </div>


            <!-- Email + Mobile -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        Email Address
                        <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        name="std_email"
                        maxlength="250"
                        placeholder="student@example.com"
                        value="{{ std.std_email }}"
                        readonly required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        name="std_mobile"
                        maxlength="10"
                        placeholder="10 digit number"
                        value="{{ std.std_mobile }}"
                    >

                </div>


            </div>


            <!-- Department + DOB -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        Department
                    </label>

                    <select name="std_dept">

                        <option value="it" {% if std.std_dept == "it" %}selected{% endif %}>
                            Information Technology
                        </option>

                        <option value="cst" {% if std.std_dept == "cst" %}selected{% endif %}>
                            Computer Science Technology
                        </option>

                        <option value="electric" {% if std.std_dept == "electric" %}selected{% endif %}>
                            Electrical
                        </option>

                        <option value="ece" {% if std.std_dept == "ece" %}selected{% endif %}>
                            Electronics & Communication
                        </option>

                        <option value="me" {% if std.std_dept == "me" %}selected{% endif %}>
                            Mechanical
                        </option>

                        <option value="ai" {% if std.std_dept == "ai" %}selected{% endif %}>
                            Artificial Intelligence
                        </option>

                        <option value="ml" {% if std.std_dept == "ml" %}selected{% endif %}>
                            Machine Learning
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        name="std_dob"
                        value="{{ std.std_dob|date:'Y-m-d' }}"
                    >

                </div>


            </div>


            <!-- Address -->

            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea
                    name="std_address"
                    placeholder="Enter student's complete address"
                >{{std.std_address}}</textarea>

            </div>


            <!-- Joining Date -->

            <div class="form-group">

                <label>
                    Joining Date
                </label>

                <input
                    type="text"
                    class="joining-date"
                    value="Automatically added by Django"
                    readonly
                >

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="btn"
            >
                Update Student
            </button>


        </form>


        <div class="footer">

            Student Management System

        </div>


    </div>


</body>

</html>
