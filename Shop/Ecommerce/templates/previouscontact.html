{% extends "base.html" %}
{% load static %}
{% block title %}Contact Now{% endblock %}
{% block body %}

<section class="padding-large">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h2 class="mb-4">Get in Touch</h2>
                    <p>Have questions? We would love to hear from you.</p>
                    <ul class="list-unstyled mt-4">
                        <li class="mb-3"><strong>Email:</strong> sudiptabera685@gmail.com</li>
                        <li class="mb-3"><strong>Phone:</strong> 9800773015</li>
                        <li class="mb-3"><strong>Address:</strong> WB, Haldia</li>
                    </ul>
                </div>
                <div class="col-md-6">
                    <form>
                        <div class="mb-3">
                            <input type="text" class="form-control p-3" placeholder="Your Name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control p-3" placeholder="Your Email" required>

                        <div class="mb-3">

                </div>
            </div>
        </div>
    </section>
